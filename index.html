              {/* Save / Cancel */}
              <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
                <button onClick={() => {
                  // Recalculate BMR/TDEE with new values
                  const newBmr = editProf.gender === "male"
                    ? 10 * editProf.weightKg + 6.25 * editProf.heightCm - 5 * editProf.age + 5
                    : 10 * editProf.weightKg + 6.25 * editProf.heightCm - 5 * editProf.age - 161;
                  const newTdee = Math.round(newBmr * editProf.actMult);
                  const newBmi = Math.round((editProf.weightKg / Math.pow(editProf.heightCm / 100, 2)) * 10) / 10;
                  const updated = { ...editProf, bmr: Math.round(newBmr), tdee: newTdee, bmi: newBmi };
                  updateProfile(updated);
                  setShowEditProfile(false);
                  setShowAvatarPicker(false);
                }} style={{ flex: 1, background: "#f97316", color: "#fff", border: "none", padding: "13px", borderRadius: 12, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>

            </div>

          {/* ── PROFILE HERO ── */}

              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 1, background: "rgba(255,255,255,0.08)", borderRadius: 14, overflow: "hidden", marginTop: 18 }}>
                {[["Age", profile.age + " yrs"], ["Height", Math.floor(profile.heightCm / 30.48) + "ft " + Math.round((profile.heightCm / 2.54) % 12) + "in"], ["BMI", profile.bmi]].map(([l, v]) => (
                  <div key={l} style={{ background: "rgba(255,255,255,0.05)", padding: "12px 8px", textAlign: "center" }}>
                    <div style={{ fontSize: 18, fontWeight: 800 }}>{v}</div>
                    <div style={{ fontSize: 10, color: "rgba(255,255,255,0.35)", textTransform: "uppercase", letterSpacing: "0.06em", marginTop: 3 }}>{l}</div>
                  </div>
                ))}
              </div>
              <button onClick={() => { setEditProf({ ...profile }); setShowEditProfile(true); setShowAvatarPicker(false); }} style={{ marginTop: 16, background: "rgba(249,115,22,0.15)", border: "1.5px solid rgba(249,115,22,0.3)", color: "#f97316", borderRadius: 12, padding: "10px 24px", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
                Edit Profile
              </button>
            </div>
          )}

          {/* ── SETTINGS READ-ONLY ── */}
          {!showEditProfile && (
            <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 18, border: "1px solid rgba(255,255,255,0.08)", marginBottom: 14, padding: 0, overflow: "hidden" }}>
              {[
                { icon: "target", label: "Daily calorie goal", val: profile.goal + " kcal", bg: "rgba(249,115,22,0.12)" },
                { icon: "scale", label: "Current weight",     val: profile.weightKg + " kg",   bg: "rgba(255,255,255,0.06)" },
                { icon: "flag", label: "Target weight",      val: profile.targetKg + " kg",   bg: "rgba(255,255,255,0.06)" },
                { icon: "run", label: "Activity level",     val: profile.actLabel,           bg: "rgba(255,255,255,0.06)" },
                { icon: "calendar", label: "Goal deadline",      val: deadline.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }), bg: "rgba(255,255,255,0.06)" },
                { icon: "activity", label: "BMR",                val: profile.bmr + " kcal",      bg: "rgba(255,255,255,0.06)" },
                { icon: "flame", label: "TDEE",               val: profile.tdee + " kcal",     bg: "rgba(255,255,255,0.06)" },
              ].map((s, i, arr) => (
                <div key={s.label} style={{ padding: "14px 18px", display: "flex", alignItems: "center", gap: 12, borderBottom: i < arr.length - 1 ? "1px solid rgba(255,255,255,0.05)" : "none" }}>
                  <div style={{ width: 34, height: 34, borderRadius: 10, background: s.bg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><Icon name={s.icon} size={16} color="rgba(255,255,255,0.6)"/></div>
                  <div style={{ flex: 1, fontWeight: 600, fontSize: 13 }}>{s.label}</div>
                  <div style={{ fontSize: 13, color: "rgba(255,255,255,0.55)" }}>{s.val}</div>
                </div>
              ))}
            </div>
          )}


          {!showEditProfile && (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <button style={{ width: "100%", padding: "14px", borderRadius: 14, border: "1px solid rgba(255,255,255,0.1)", background: "rgba(255,255,255,0.05)", color: "rgba(255,255,255,0.5)", fontSize: 14, fontWeight: 600, cursor: "pointer" }}
                onClick={() => onReset()}>
                Log out
              </button>
              <button style={{ width: "100%", padding: "14px", borderRadius: 14, border: "1px solid rgba(248,113,113,0.25)", background: "rgba(248,113,113,0.1)", color: "#f87171", fontSize: 14, fontWeight: 700, cursor: "pointer" }}
                onClick={() => {
                  if (resetConfirm) {
                    try { localStorage.removeItem(STORE_KEY); localStorage.removeItem("nutriai_activity"); localStorage.removeItem("nutriai_weighins"); localStorage.removeItem(XP_KEY); localStorage.removeItem(CHALLENGES_KEY); } catch(_) {}
                    onHardReset();
                  } else {
                    setResetConfirm(true);
                    setTimeout(() => setResetConfirm(false), 3000);
                  }
                }}>
                {resetConfirm ? "Tap again to confirm — this can't be undone" : "Reset & start over"}
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}


const SECRET_QUESTIONS = [
  "What was the name of your first pet?",
  "What city were you born in?",
  "What is your mother's maiden name?",
  "What was the name of your first school?",
  "What was your childhood nickname?",
];

const authInputStyle = { width: "100%", padding: "13px 16px", borderRadius: 12, border: "1.5px solid rgba(255,255,255,0.08)", background: "rgba(255,255,255,0.05)", color: "#fff", fontSize: 15, outline: "none", boxSizing: "border-box", fontFamily: "inherit", colorScheme: "dark" };
const authLabelStyle = { fontSize: 11, fontWeight: 600, color: "rgba(255,255,255,0.55)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 7, display: "block" };

function MaskedInput({ value, onChange, placeholder, style }) {
  const [display, setDisplay] = useState("");
  const timerRef = useRef(null);

  const handleChange = (e) => {
    const newVal = e.target.value;
    // Build display: all bullets except last char shown briefly
    const masked = "•".repeat(Math.max(0, newVal.length - 1)) + (newVal.length > 0 ? newVal[newVal.length - 1] : "");
    setDisplay(masked);
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => {
      setDisplay("•".repeat(newVal.length));
    }, 600);
    onChange(newVal);
  };

  // Sync display length if value cleared externally
  useEffect(() => {
    if (value === "") setDisplay("");
  }, [value]);

  return (
    <input
      style={style}
      type="text"
      placeholder={placeholder}
      value={display}
      onChange={handleChange}
    />
  );
}

function SignupScreen({ onBack, onDone }) {
  const [su, setSu] = useState({ email: "", password: "", secretQ: SECRET_QUESTIONS[0], secretA: "" });
  const [err, setErr] = useState("");
  const handle = () => {
    if (!su.email.includes("@")) { setErr("Please enter a valid email"); return; }
    if (su.password.length < 4) { setErr("Password must be at least 4 characters"); return; }
    if (!su.secretA.trim()) { setErr("Please answer the secret question"); return; }
    onDone({ email: su.email, password: su.password, secretQ: su.secretQ, secretA: su.secretA.trim().toLowerCase() });
  };
  return (
    <div style={{ minHeight: "100vh", background: "#0a0a0c", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "0 24px", fontFamily: "'DM Sans', system-ui, sans-serif" }}>
      <div style={{ width: "100%", maxWidth: 360 }}>
        <button onClick={onBack} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.35)", fontSize: 14, cursor: "pointer", marginBottom: 28, padding: 0 }}>← Back</button>
        <div style={{ fontSize: 32, fontWeight: 900, color: "#fff", letterSpacing: "-1.5px", marginBottom: 6 }}>Create account</div>
        <div style={{ fontSize: 14, color: "rgba(255,255,255,0.35)", marginBottom: 32 }}>Set up your credentials first</div>
        <div style={{ marginBottom: 16 }}>
          <label style={authLabelStyle}>Email</label>
          <input style={authInputStyle} type="email" placeholder="you@example.com" value={su.email} onChange={e => { setSu(p => ({...p, email: e.target.value})); setErr(""); }} />
        </div>
        <div style={{ marginBottom: 16 }}>
          <label style={authLabelStyle}>Password</label>
          <MaskedInput style={authInputStyle} placeholder="Choose a password" value={su.password} onChange={v => { setSu(p => ({...p, password: v})); setErr(""); }} />
        </div>
        <div style={{ marginBottom: 8 }}>
          <label style={authLabelStyle}>Secret question</label>
          <select value={su.secretQ} onChange={e => setSu(p => ({...p, secretQ: e.target.value}))} style={{ ...authInputStyle, marginBottom: 10 }}>
            {SECRET_QUESTIONS.map(q => <option key={q} value={q} style={{ background: "#1a1a1e" }}>{q}</option>)}
          </select>
          <input style={authInputStyle} type="text" placeholder="Your answer (remember this!)" value={su.secretA} onChange={e => { setSu(p => ({...p, secretA: e.target.value})); setErr(""); }} />
        </div>
        {err && <div style={{ color: "#f87171", fontSize: 13, marginTop: 8, marginBottom: 4, display: "flex", alignItems: "center", gap: 6 }}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f87171" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>{err}</div>}
        <div style={{ marginTop: 24 }}>
          <PrimaryBtn onClick={handle} style={{ borderRadius: 99, fontSize: 16, padding: "15px" }}>Next: Set up profile →</PrimaryBtn>
        </div>
      </div>
    </div>
  );
}

function LoginScreen({ onBack, onSuccess, onReset }) {
  const [li, setLi] = useState({ email: "", password: "" });
  const [err, setErr] = useState("");
  const [loginAttempts, setLoginAttempts] = useState(0);
  const [forgotMode, setForgotMode] = useState(false);
  const [secretAnswer, setSecretAnswer] = useState("");
  const [secretAttempts, setSecretAttempts] = useState(0);
  const [showResetOption, setShowResetOption] = useState(false);
  const [resetConfirm, setResetConfirm] = useState(false);
  const [savedCreds, setSavedCreds] = useState(null);
  const MAX_ATTEMPTS = 3;
  const errIcon = <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f87171" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;

  useEffect(() => { loadData().then(d => { if (d?.profile) setSavedCreds(d.profile); }); }, []);

  const handleLogin = async () => {
    const saved = await loadData();
    if (!saved?.profile) { setErr("No account found. Please create one."); return; }
    if (li.email.toLowerCase() !== (saved.profile.email || "").toLowerCase()) { setErr("Email not recognised"); return; }
    if (li.password !== saved.profile.password) {
      const attempts = loginAttempts + 1;
      setLoginAttempts(attempts);
      if (attempts >= MAX_ATTEMPTS) {
        setErr("Wrong password. " + MAX_ATTEMPTS + " failed attempts — try 'Forgot password?' or reset below.");
      } else {
        const left = MAX_ATTEMPTS - attempts;
        setErr("Wrong password. " + left + " attempt" + (left === 1 ? "" : "s") + " left before reset option appears.");
      }
      return;
    }
    onSuccess(saved);
  };

  const handleForgot = async () => {
    const saved = await loadData();
    if (!saved?.profile) { setErr("No account found."); return; }
    if (secretAnswer.trim().toLowerCase() !== (saved.profile.secretA || "")) {
      const attempts = secretAttempts + 1;
      setSecretAttempts(attempts);
      if (attempts >= MAX_ATTEMPTS) {
        setShowResetOption(true);
        setErr("Answer doesn't match. You can reset your account below.");
      } else {
        const left2 = MAX_ATTEMPTS - attempts;
        setErr("Answer doesn't match. " + left2 + " attempt" + (left2 === 1 ? "" : "s") + " left.");
      }
      return;
    }
    onSuccess(saved);
  };

  return (
    <div style={{ minHeight: "100vh", background: "#0a0a0c", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "0 24px", fontFamily: "'DM Sans', system-ui, sans-serif" }}>
      <div style={{ width: "100%", maxWidth: 360 }}>
        <button onClick={forgotMode ? () => { setForgotMode(false); setErr(""); setSecretAttempts(0); setShowResetOption(false); setResetConfirm(false); } : onBack} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.35)", fontSize: 14, cursor: "pointer", marginBottom: 28, padding: 0 }}>← Back</button>
        <div style={{ fontSize: 32, fontWeight: 900, color: "#fff", letterSpacing: "-1.5px", marginBottom: 6 }}>
          {forgotMode ? "Forgot password?" : "Welcome back 👋"}
        </div>
        <div style={{ fontSize: 14, color: "rgba(255,255,255,0.35)", marginBottom: 32 }}>
          {forgotMode ? "Answer your secret question to get back in" : "Log in to your account"}
        </div>

        {!forgotMode ? (
          <>
            <div style={{ marginBottom: 16 }}>
              <label style={authLabelStyle}>Email</label>
              <input style={authInputStyle} type="email" placeholder="you@example.com" value={li.email} onChange={e => { setLi(p => ({...p, email: e.target.value})); setErr(""); }} />
            </div>
            <div style={{ marginBottom: 8 }}>
              <label style={authLabelStyle}>Password</label>
              <MaskedInput style={authInputStyle} placeholder="Your password" value={li.password} onChange={v => { setLi(p => ({...p, password: v})); setErr(""); }} />
            </div>
            {err && <div style={{ color: "#f87171", fontSize: 13, marginTop: 8, marginBottom: 4, display: "flex", alignItems: "center", gap: 6 }}>{errIcon}{err}</div>}
            {/* Attempt dots */}
            {loginAttempts > 0 && loginAttempts < MAX_ATTEMPTS && (
              <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
                {Array.from({ length: MAX_ATTEMPTS }).map((_, i) => (
                  <div key={i} style={{ width: 8, height: 8, borderRadius: "50%", background: i < loginAttempts ? "#f87171" : "rgba(255,255,255,0.1)" }} />
                ))}
              </div>
            )}
            <div style={{ marginTop: 24, display: "flex", flexDirection: "column", gap: 12 }}>
              <PrimaryBtn onClick={handleLogin} style={{ borderRadius: 99, fontSize: 16, padding: "15px" }}>Log in →</PrimaryBtn>
              <button onClick={() => { setForgotMode(true); setErr(""); }} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.35)", fontSize: 14, cursor: "pointer", padding: "8px 0" }}>
                Forgot password?
              </button>
            </div>
          </>
        ) : (
          <>
            {savedCreds?.secretQ && (
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: "rgba(255,255,255,0.55)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6 }}>Your secret question</div>
                <div style={{ fontSize: 15, fontWeight: 600, color: "#fff", lineHeight: 1.4 }}>{savedCreds.secretQ}</div>
              </div>
            )}
            <div style={{ marginBottom: 8 }}>
              <label style={authLabelStyle}>Your answer</label>
              <input style={authInputStyle} type="text" placeholder="Type your answer" value={secretAnswer} onChange={e => { setSecretAnswer(e.target.value); setErr(""); }} />
            </div>
            {err && <div style={{ color: "#f87171", fontSize: 13, marginTop: 8, marginBottom: 4, display: "flex", alignItems: "center", gap: 6 }}>{errIcon}{err}</div>}
            {/* Attempt dots */}
            {secretAttempts > 0 && !showResetOption && (
              <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
                {Array.from({ length: MAX_ATTEMPTS }).map((_, i) => (
                  <div key={i} style={{ width: 8, height: 8, borderRadius: "50%", background: i < secretAttempts ? "#f87171" : "rgba(255,255,255,0.1)" }} />
                ))}
              </div>
            )}
            <div style={{ marginTop: 24, display: "flex", flexDirection: "column", gap: 12 }}>
              {!showResetOption && (
                <PrimaryBtn onClick={handleForgot} style={{ borderRadius: 99, fontSize: 16, padding: "15px" }}>Verify & log in →</PrimaryBtn>
              )}
              {/* Reset option after 3 failed secret attempts */}
              {showResetOption && (
                <div style={{ background: "rgba(248,113,113,0.06)", border: "1px solid rgba(248,113,113,0.2)", borderRadius: 16, padding: "16px" }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "rgba(255,255,255,0.6)", marginBottom: 4 }}>Can't remember your answer?</div>
                  <div style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", marginBottom: 14, lineHeight: 1.5 }}>You can reset your account and start fresh. This will permanently delete all your data.</div>
                  <button onClick={() => {
                    if (resetConfirm) { onReset(); }
                    else { setResetConfirm(true); setTimeout(() => setResetConfirm(false), 4000); }
                  }} style={{ width: "100%", padding: "13px", borderRadius: 12, border: "1px solid rgba(248,113,113,0.3)", background: "rgba(248,113,113,0.1)", color: "#f87171", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
                    {resetConfirm ? "Tap again to confirm — all data will be lost" : "Reset account & start over"}
                  </button>
                </div>
              )}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════
// ROOT
// ════════════════════════════════════════════
function App() {
  const [phase, setPhase] = useState("boot");
  const [step, setStep]   = useState(1);
  const [form, setForm]   = useState({ name: "", email: "", password: "", secretQ: "What was the name of your first pet?", secretA: "", gender: "female", dob: "", heightCm: 0, weightKg: "", targetKg: "", months: 3, actMult: 1.2, actLabel: "Sedentary" });
  const [profile, setProfile] = useState(null);
  const [plan, setPlan]       = useState(null);
  const [log, setLogState]    = useState({});
  const [activityData, setActivityData] = useState({});

  // Scroll to top on every page/step change
  useEffect(() => { window.scrollTo({ top: 0, behavior: "instant" }); }, [phase, step]);

  const updateProfile = (updated) => {
    setProfile(updated);
    saveData({ profile: updated, log });
  };


  useEffect(() => {
    (async () => {
      try {
        const saved = await loadData();
        if (saved?.profile?.goal) {
          setPhase("login");
        } else {
          setPhase("splash");
        }
        try {
          const r = localStorage.getItem("nutriai_activity");
          setActivityData(r ? JSON.parse(r) : {});
        } catch(_) { setActivityData({}); }
      } catch(_) {
        setPhase("splash");
      }
    })();
  }, []);

  const setLog = (newLog) => {
    setLogState(newLog);
    saveData({ profile, log: newLog });
  };

  const setField = (k, v) => setForm(p => ({ ...p, [k]: v }));

  const finishOnboarding = () => {
    const age = calcAge(form.dob);
    const full = { ...form, age, weightKg: parseFloat(form.weightKg), targetKg: parseFloat(form.targetKg) };
    const computed = calcPlan(full);
    setPlan(computed);
    setProfile({ ...full, ...computed, startWeight: form.weightKg, startDate: todayStr() });
    setPhase("results");
  };

  const launchApp = (finalProfile) => {
    saveData({ profile: finalProfile, log });
    setProfile(finalProfile);
    setPhase("app");
  };

  const logout = () => {
    setProfile(null); setPlan(null); setLogState({}); setActivityData({});
    setStep(1); setForm({ name: "", gender: "female", dob: "", heightCm: 0, weightKg: "", targetKg: "", months: 3, actMult: 1.2, actLabel: "Sedentary" });
    setPhase("login");
  };

  const reset = () => {
    setProfile(null); setPlan(null); setLogState({}); setActivityData({});
    try { localStorage.removeItem(STORE_KEY); localStorage.removeItem("nutriai_activity"); localStorage.removeItem("nutriai_weighins"); localStorage.removeItem(XP_KEY); localStorage.removeItem(CHALLENGES_KEY); } catch(_) {}
    setStep(1); setForm({ name: "", gender: "female", dob: "", heightCm: 0, weightKg: "", targetKg: "", months: 3, actMult: 1.2, actLabel: "Sedentary" });
    setPhase("splash");
  };

  if (phase === "boot") return (
    <div style={{ minHeight: "100vh", background: "#0f0f11", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ color: "#f97316", fontSize: 16, fontFamily: "system-ui,sans-serif" }}>Loading…</div>
    </div>
  );

  if (phase === "splash") return (
    <div style={{ minHeight: "100vh", background: "#0a0a0c", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center", padding: "0 24px", fontFamily: "'DM Sans', system-ui, sans-serif" }}>
      <div style={{ fontSize: 48, fontWeight: 900, color: "#fff", letterSpacing: "-2px", marginBottom: 10 }}>
        Nutri<span style={{ color: "#f97316" }}>AI</span>
      </div>
      <div style={{ fontSize: 16, color: "rgba(255,255,255,0.35)", marginBottom: 48, lineHeight: 1.5 }}>
        Smart calorie tracking,<br />powered by AI
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12, width: "100%", maxWidth: 300 }}>
        <PrimaryBtn onClick={() => setPhase("signup")} style={{ padding: "17px 32px", fontSize: 16, borderRadius: 99 }}>
          Create account →
        </PrimaryBtn>
        <button onClick={() => setPhase("login")} style={{ width: "100%", padding: "15px 32px", borderRadius: 99, border: "1.5px solid rgba(255,255,255,0.15)", background: "transparent", color: "rgba(255,255,255,0.7)", fontSize: 16, fontWeight: 600, cursor: "pointer" }}>
          Log in
        </button>
      </div>
    </div>
  );

  if (phase === "signup") return (
    <SignupScreen onBack={() => setPhase("splash")} onDone={creds => { setForm(p => ({...p, ...creds})); setPhase("onboard"); }} />
  );

  if (phase === "login") return (
    <LoginScreen onBack={() => setPhase("splash")} onReset={reset} onSuccess={async (saved) => {
      setProfile(saved.profile);
      setLogState(saved.log || {});
      try { const r = localStorage.getItem("nutriai_activity"); setActivityData(r ? JSON.parse(r) : {}); } catch(_) {}
      setPhase("app");
    }} />
  );

  if (phase === "onboard") return (
    <>
      {step === 1 && <Step1 data={form} set={setField} onNext={() => setStep(2)} onBack={() => setPhase("signup")} />}
      {step === 2 && <Step2 data={form} set={setField} onNext={() => setStep(3)} onBack={() => setStep(1)} />}
      {step === 3 && <Step3 data={form} set={setField} onNext={() => setStep(4)} onBack={() => setStep(2)} />}
      {step === 4 && <Step4 data={form} set={setField} onNext={() => setStep(5)} onBack={() => setStep(3)} />}
      {step === 5 && <Step5 data={form} set={setField} onNext={finishOnboarding} onBack={() => setStep(4)} />}
    </>
  );

  if (phase === "results") return <Results profile={{ ...form, age: calcAge(form.dob) }} plan={plan} onStart={launchApp} />;
  if (phase === "app")     return <MainApp profile={profile} log={log} setLog={setLog} activityData={activityData} setActivityData={setActivityData} onReset={logout} onHardReset={reset} updateProfile={updateProfile} />;
  return null;
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Reset zoom when keyboard closes on iOS
    document.addEventListener('focusout', function() {
      if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
        setTimeout(() => {
          const mv = document.querySelector('meta[name=viewport]');
          mv.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
        }, 100);
      }
    });

  </script>
</body>
</html>
