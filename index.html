function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function calcAge(dob) {
  const b = new Date(dob), now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  if (now.getMonth() < b.getMonth() || (now.getMonth() === b.getMonth() && now.getDate() < b.getDate())) age--;
  return age;
}

function calcPlan(p) {
  // Mifflin-St Jeor BMR
  const bmr = p.gender === "male"
    ? 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age + 5
    : 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age - 161;
  const tdee = Math.round(bmr * p.actMult);
  const totalDeficit = (p.weightKg - p.targetKg) * 7700;
  const dailyDeficit = Math.round(totalDeficit / (p.months * 30));
  const recommended = Math.max(1200, Math.round(tdee - dailyDeficit));
  const gentle     = Math.max(1200, Math.round(tdee - dailyDeficit * 0.6));
  const aggressive = Math.max(1200, Math.round(tdee - dailyDeficit * 1.4));
  const bmi = Math.round((p.weightKg / Math.pow(p.heightCm / 100, 2)) * 10) / 10;
  const protein = Math.round(recommended * 0.30 / 4);
  const carbs   = Math.round(recommended * 0.40 / 4);
  const fat     = Math.round(recommended * 0.30 / 9);
  const deadline = new Date();
  deadline.setMonth(deadline.getMonth() + p.months);
  return { bmr: Math.round(bmr), tdee, dailyDeficit, recommended, gentle, aggressive, bmi, protein, carbs, fat, deadline: deadline.toISOString() };
}

const XP_KEY = "nutriai_xp";

const LEVELS = [
  { name: "Beginner",   min: 0,    color: "#94a3b8", emoji: "🌱" },
  { name: "Motivated",  min: 200,  color: "#34d399", emoji: "⚡" },

  { name: "Elite",      min: 4000, color: "#f87171", emoji: "👑" },
];

function getLevel(xp) {
  for (let i = LEVELS.length - 1; i >= 0; i--) {
    if (xp >= LEVELS[i].min) return { ...LEVELS[i], index: i, next: LEVELS[i + 1] || null };
  }
  return { ...LEVELS[0], index: 0, next: LEVELS[1] };
}

function getDailyChallenges(dateStr) {
  // Seeded by date so challenges are same for everyone on same day
  const seed = dateStr.replace(/-/g, "").split("").reduce((a, c) => a * 31 + c.charCodeAt(0), 0);
  const rng = (n) => { const x = Math.sin(seed + n) * 10000; return x - Math.floor(x); };
  const ALL_CHALLENGES = [
    { id: "log_breakfast",   label: "Log breakfast",           desc: "Log any food before noon",           xp: 30,  icon: "☀️"  },
    { id: "log_3_meals",     label: "Log 3 meals",             desc: "Log breakfast, lunch & dinner",      xp: 60,  icon: "🍽️"  },
    { id: "hit_water",       label: "Hit water goal",          desc: "Drink 8 glasses today",              xp: 40,  icon: "💧"  },
    { id: "hit_steps_5k",    label: "Walk 5,000 steps",        desc: "Log at least 5,000 steps",           xp: 35,  icon: "👟"  },
    { id: "hit_steps_10k",   label: "Walk 10,000 steps",       desc: "Log at least 10,000 steps",         xp: 70,  icon: "🏃"  },
    { id: "stay_on_goal",    label: "Stay within calories",    desc: "Log meals within your daily goal",   xp: 50,  icon: "🎯"  },
    { id: "log_exercise",    label: "Log a workout",           desc: "Add any exercise today",             xp: 45,  icon: "🏋️"  },
    { id: "protein_goal",    label: "Hit protein target",      desc: "Reach your daily protein goal",      xp: 40,  icon: "💪"  },
    { id: "log_5_foods",     label: "Log 5 food items",        desc: "Track 5 different items today",      xp: 35,  icon: "📋"  },
    { id: "open_streak",     label: "Keep your streak alive",  desc: "Log anything to keep your streak",  xp: 25,  icon: "🔥"  },
  ];
  const idToNum = (id) => id.split("").reduce((a, c) => a * 17 + c.charCodeAt(0), 0);
  const shuffled = [...ALL_CHALLENGES].sort((a, b) => rng(idToNum(a.id)) - rng(idToNum(b.id)));
  return shuffled.slice(0, 3);
}

function checkChallenge(id, { log, activityData, profile, today }) {
  const todayLog = log[today] || [];
  const act = activityData[today] || {};
  const meals = new Set(todayLog.map(e => e.meal));
  const totalCal = todayLog.reduce((s, e) => s + e.calories, 0);
  const totalP = todayLog.reduce((s, e) => s + e.protein, 0);
  switch(id) {
    case "log_breakfast":  return meals.has("breakfast");
    case "log_3_meals":    return meals.has("breakfast") && meals.has("lunch") && meals.has("dinner");
    case "hit_water":      return (act.waterMl || 0) >= 2000;
    case "hit_steps_5k":   return (act.steps || 0) >= 5000;
    case "hit_steps_10k":  return (act.steps || 0) >= 10000;
    case "stay_on_goal":   return totalCal > 0 && totalCal <= profile.goal;
    case "log_exercise":   return (act.exercises || []).length > 0;
    case "protein_goal":   return totalP >= (profile.protein || 0);
    case "log_5_foods":    return todayLog.length >= 5;
    case "open_streak":    return todayLog.length > 0;
    default: return false;
  }
}

// ─── tiny UI primitives ───────────────────────────────────────
function Ring({ pct = 0, size = 120, strokeW = 10, color = "#f97316", bg = "rgba(255,255,255,0.08)", children }) {
  const r = (size - strokeW) / 2;
  const circ = 2 * Math.PI * r;
  const off = circ * (1 - Math.min(1, pct / 100));
  return (
    <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)", display: "block" }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={bg} strokeWidth={strokeW} />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={strokeW}
          strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={off}
          style={{ transition: "stroke-dashoffset 0.9s ease" }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
        {children}
      </div>
    </div>
  );
}

  );
}

function StepShell({ step, total, title, sub, children, onNext, onBack, nextLabel = "Continue →" }) {
  const pct = (step / total) * 100;
  return (
    <div style={{ minHeight: "100vh", background: "#0f0f11", display: "flex", flexDirection: "column", fontFamily: "'DM Sans', system-ui, sans-serif", overflow: "hidden" }}>
      <div style={{ maxWidth: 460, margin: "0 auto", width: "100%", flex: 1, display: "flex", flexDirection: "column", padding: "0 22px 36px", overflow: "hidden" }}>
        {/* Progress */}
        <div style={{ padding: "18px 0 12px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 7 }}>
            <span style={{ fontSize: 11, color: "rgba(255,255,255,0.35)" }}>Step {step} of {total}</span>
            <span style={{ fontSize: 11, color: "#f97316", fontWeight: 600 }}>{Math.round(pct)}%</span>
          </div>
          <div style={{ height: 3, background: "rgba(255,255,255,0.08)", borderRadius: 99, overflow: "hidden" }}>
            <div style={{ width: `${pct}%`, height: "100%", background: "linear-gradient(90deg,#f97316,#ea580c)", borderRadius: 99, transition: "width 0.5s ease" }} />
          </div>
        </div>
        {/* Header */}
        <div style={{ padding: "16px 0 22px" }}>
          <div style={{ fontSize: 11, color: "#f97316", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 8 }}>Step {step}</div>
          <h2 style={{ fontSize: 26, fontWeight: 800, color: "#fff", margin: "0 0 6px", letterSpacing: "-0.5px", lineHeight: 1.2 }}>{title}</h2>
          {sub && <p style={{ fontSize: 14, color: "rgba(255,255,255,0.55)", margin: 0, lineHeight: 1.5 }}>{sub}</p>}
        </div>
        {/* Body */}
        <div style={{ flex: 1 }}>{children}</div>
        {/* Nav */}
        <div style={{ paddingTop: 20 }}>
          <PrimaryBtn onClick={onNext}>{nextLabel}</PrimaryBtn>
          {onBack && <GhostBtn onClick={onBack}>← Back</GhostBtn>}
        </div>
      </div>
    </div>
  );
}

function Step1({ data, set, onNext, onBack }) {
  const [err, setErr] = useState("");
  const go = () => { if (!data.name.trim()) { setErr("Please enter your name"); return; } setErr(""); onNext(); };
  return (
    <StepShell step={1} total={5} title="Let's meet you" sub="We'll personalise your plan around your profile" onNext={go} onBack={onBack}>
      <Input label="First name" placeholder="e.g. Sarah" value={data.name}
        onChange={e => { set("name", e.target.value); setErr(""); }} />
      {err && <div style={{ color: "#f87171", fontSize: 12, marginTop: -10, marginBottom: 12, display: "flex", alignItems: "center", gap: 5 }}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f87171" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>{err}</div>}
      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 11, fontWeight: 600, color: "rgba(255,255,255,0.55)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 9 }}>Gender</div>
        <Seg value={data.gender} onChange={v => set("gender", v)}
          options={[{ value: "female", label: "Female" }, { value: "male", label: "Male" }, { value: "other", label: "Other" }]} />
      </div>
    </StepShell>
  );
}

function Step2({ data, set, onNext, onBack }) {
  const [err, setErr] = useState("");
  const age = data.dob ? calcAge(data.dob) : null;
  const go = () => {
    if (!data.dob || !age || age < 10 || age > 110) { setErr("Please enter a valid date of birth"); return; }
    setErr(""); onNext();
  };
  return (
    <StepShell step={2} total={5} title="When were you born?" sub="Age changes your metabolic rate calculation" onNext={go} onBack={onBack}>
      <Input label="Date of birth" type="date" value={data.dob} max={todayStr()}
        onChange={e => { set("dob", e.target.value); setErr(""); }} />
      {err && <div style={{ color: "#f87171", fontSize: 12, marginTop: -10, marginBottom: 12, display: "flex", alignItems: "center", gap: 5 }}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f87171" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>{err}</div>}
      {age !== null && !err && (
        <div style={{ background: "rgba(249,115,22,0.1)", border: "1.5px solid rgba(249,115,22,0.25)", borderRadius: 14, padding: "14px 18px", display: "flex", alignItems: "center", gap: 14, marginTop: 4 }}>
          <Icon name="calendar" size={28} color="#f97316"/>
          <div>
            <div style={{ fontSize: 20, fontWeight: 800, color: "#f0f0f0" }}>{age} years old</div>
            <div style={{ fontSize: 12, color: "rgba(255,255,255,0.55)", marginTop: 2 }}>
              {new Date(data.dob).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}
            </div>
          </div>
        </div>
      )}
    </StepShell>
  );
}

function Step3({ data, set, onNext, onBack }) {
  const [unit, setUnit] = useState("ft");
  const [ft, setFt] = useState("");
  const [inch, setInch] = useState("");
  const [cm, setCm] = useState("");
  const [err, setErr] = useState("");

  const fromFtIn = (f, i) => {
    const v = (parseFloat(f) || 0) * 30.48 + (parseFloat(i) || 0) * 2.54;
    if (v > 0) set("heightCm", Math.round(v));
  };

  const go = () => {
    if (!data.heightCm || data.heightCm < 100 || data.heightCm > 250) { setErr("Please enter a valid height"); return; }
    setErr(""); onNext();
  };

  const display = data.heightCm
    ? `${Math.floor(data.heightCm / 30.48)}ft ${Math.round((data.heightCm / 2.54) % 12)}in = ${data.heightCm} cm`
    : "";

  return (
    <StepShell step={3} total={5} title="How tall are you?" sub="Used to calculate your BMI and daily energy needs" onNext={go} onBack={onBack}>
      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 11, fontWeight: 600, color: "rgba(255,255,255,0.55)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 9 }}>Unit</div>
        <Seg value={unit} onChange={v => { setUnit(v); setErr(""); }}
          options={[{ value: "ft", label: "ft & in" }, { value: "cm", label: "cm" }]} />
      </div>

      {unit === "ft" ? (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Input label="Feet" type="number" min="3" max="8" placeholder="0" value={ft}
            onChange={e => { setFt(e.target.value); fromFtIn(e.target.value, inch); setErr(""); }} />
          <Input label="Inches" type="number" min="0" max="11" placeholder="0" value={inch}
            onChange={e => { setInch(e.target.value); fromFtIn(ft, e.target.value); setErr(""); }} />
        </div>
      ) : (
        <Input label="Centimetres" type="number" min="100" max="250" placeholder="155" value={cm}
          onChange={e => { setCm(e.target.value); const v = parseFloat(e.target.value); if (v > 0) set("heightCm", Math.round(v)); setErr(""); }} />
      )}

      {display && <div style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", marginTop: -8, marginBottom: 12 }}>{display}</div>}
      {err && <div style={{ color: "#f87171", fontSize: 12, marginBottom: 12, display: "flex", alignItems: "center", gap: 5 }}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f87171" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>{err}</div>}
    </StepShell>
  );
}

function Step4({ data, set, onNext, onBack }) {
  const [errs, setErrs] = useState({});
  const go = () => {
    const e = {}; const cw = parseFloat(data.weightKg); const tw = parseFloat(data.targetKg);
    if (!cw || cw < 30) e.cw = "Enter current weight";
    if (!tw || tw < 30) e.tw = "Enter target weight";
    if (cw && tw && cw <= tw) e.tw = "Target must be lower than current for weight loss";
    if (Object.keys(e).length) { setErrs(e); return; }
    setErrs({}); onNext();
  };
  const cw = parseFloat(data.weightKg), tw = parseFloat(data.targetKg);
  const diff = cw && tw && cw > tw ? (cw - tw).toFixed(1) : null;

  return (
    <StepShell step={4} total={5} title="Weight & goal" sub="We'll compute your exact daily calorie target" onNext={go} onBack={onBack}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <div>
          <Input label="Current weight (kg)" type="number" min="30" max="300" step="0.1" placeholder="0"
            value={data.weightKg === 0 ? "" : (data.weightKg ?? "")}
            onChange={e => { set("weightKg", e.target.value); setErrs(p => ({ ...p, cw: "" })); }} />
          {errs.cw && <div style={{ color: "#f87171", fontSize: 11, marginTop: -12, marginBottom: 10, display: "flex", alignItems: "center", gap: 5 }}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f87171" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>{errs.cw}</div>}
        </div>
        <div>
          <Input label="Target weight (kg)" type="number" min="30" max="300" step="0.1" placeholder="0"
            value={data.targetKg === 0 ? "" : (data.targetKg ?? "")}
            onChange={e => { set("targetKg", e.target.value); setErrs(p => ({ ...p, tw: "" })); }} />
          {errs.tw && <div style={{ color: "#f87171", fontSize: 11, marginTop: -12, marginBottom: 10, display: "flex", alignItems: "center", gap: 5 }}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f87171" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>{errs.tw}</div>}
        </div>
      </div>

      {diff && (
        <div style={{ background: "rgba(52,211,153,0.1)", border: "1.5px solid rgba(52,211,153,0.25)", borderRadius: 12, padding: "12px 16px", fontSize: 14, color: "#34d399", marginBottom: 16 }}>
          Goal: lose <strong style={{ color: "#34d399" }}>{diff} kg</strong> total
        </div>
      )}

      <div style={{ fontSize: 11, fontWeight: 600, color: "rgba(255,255,255,0.55)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 10 }}>Timeline</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {TIMELINES.map(t => (
          <Chip key={t.months} active={data.months === t.months} onClick={() => set("months", t.months)}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <Icon name={t.icon} size={20} color={data.months === t.months ? "#f97316" : "rgba(255,255,255,0.4)"}/>
              <div>
                <div style={{ fontWeight: 700, fontSize: 14 }}>{t.label}</div>
                <div style={{ fontSize: 12, color: "rgba(255,255,255,0.55)", marginTop: 2 }}>{t.sub}</div>
              </div>
              <div style={{ marginLeft: "auto", width: 18, height: 18, borderRadius: "50%",
                background: data.months === t.months ? "#f97316" : "transparent",
                border: data.months === t.months ? "none" : "1.5px solid rgba(255,255,255,0.08)",
                display: "flex", alignItems: "center", justifyContent: "center" }}>
                {data.months === t.months && <div style={{ width: 7, height: 7, borderRadius: "50%", background: "#fff" }} />}
              </div>
            </div>
          </Chip>
        ))}
      </div>
    </StepShell>
  );
}

function Step5({ data, set, onNext, onBack }) {
  return (
    <StepShell step={5} total={5} title="How active are you?" sub="Determines your total daily energy expenditure (TDEE)" onNext={onNext} onBack={onBack} nextLabel="Calculate my plan ✨">
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {ACTIVITIES.map(a => (
          <Chip key={a.mult} active={data.actMult === a.mult} onClick={() => { set("actMult", a.mult); set("actLabel", a.label); }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <div>
                <div style={{ fontWeight: 700, fontSize: 14 }}>{a.label}</div>
                <div style={{ fontSize: 12, color: "rgba(255,255,255,0.55)", marginTop: 2 }}>{a.sub}</div>
              </div>
              <div style={{ fontSize: 12, color: "#f97316", fontWeight: 700 }}>×{a.mult}</div>
            </div>
          </Chip>
        ))}
      </div>
    </StepShell>
  );
}

function Results({ profile, plan, onStart }) {
  const [chosen, setChosen] = useState("recommended");
  const goal = plan[chosen];
  const lossKg = (profile.weightKg - profile.targetKg).toFixed(1);
  const bmiLabel = plan.bmi < 18.5 ? "Underweight" : plan.bmi < 25 ? "Normal weight" : plan.bmi < 30 ? "Overweight" : "Obese";
  const bmiColor = plan.bmi < 18.5 ? "rgba(255,255,255,0.5)" : plan.bmi < 25 ? "#34d399" : plan.bmi < 30 ? "#f97316" : "#f87171";
  const ringPct = Math.round(goal / plan.tdee * 100);

  const milestones = [{ month: 0, label: "Start", weight: profile.weightKg, icon: "●" }];
  const perMonth = (profile.weightKg - profile.targetKg) / profile.months;
  for (let m = 1; m <= profile.months; m++) {
    const d = new Date(); d.setMonth(d.getMonth() + m);
    milestones.push({ month: m, label: d.toLocaleDateString("en-GB", { month: "short", year: "numeric" }), weight: (profile.weightKg - perMonth * m).toFixed(1), icon: m === profile.months ? "★" : "●" });
  }

  const handleStart = () => {
    onStart({ ...profile, ...plan, goal, selectedPlan: chosen, startWeight: profile.weightKg, startDate: todayStr() });
  };

  return (
    <div style={{ background: "#0a0a0c", minHeight: "100vh", fontFamily: "'DM Sans', system-ui, sans-serif", color: "#fff" }}>
      <div style={{ maxWidth: 460, margin: "0 auto", padding: "0 20px 60px" }}>
        {/* Hero */}
        <div style={{ textAlign: "center", padding: "36px 0 24px" }}>
          <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", textTransform: "uppercase", letterSpacing: "0.12em", marginBottom: 10 }}>Your personalised plan</div>
          <div style={{ fontSize: 28, fontWeight: 800, marginBottom: 6 }}>Hi, {profile.name}! 👋</div>
          <div style={{ fontSize: 14, color: "rgba(255,255,255,0.55)" }}>Lose {lossKg} kg in {profile.months} month{profile.months > 1 ? "s" : ""}</div>
        </div>

        {/* Big ring */}
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 28 }}>
          <Ring size={176} strokeW={14} pct={ringPct} color="#f97316" bg="rgba(255,255,255,0.05)">
            <div style={{ fontSize: 38, fontWeight: 800, letterSpacing: "-1.5px", lineHeight: 1 }}>{goal}</div>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.55)", textTransform: "uppercase", letterSpacing: "0.06em", marginTop: 4 }}>kcal / day</div>
          </Ring>
        </div>

        {/* Intensity picker */}
        <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", textTransform: "uppercase", letterSpacing: "0.1em", textAlign: "center", marginBottom: 12 }}>Choose your calorie target</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: plan.gentle === 1200 && plan.recommended === 1200 && plan.aggressive === 1200 ? 12 : 24 }}>
          {[
            ["gentle",      "Relaxed",      "Eat more,\nlose slowly"],
            ["recommended", "Balanced ★",  "Recommended\npace"],
            ["aggressive",  "Fast",         "Eat less,\nlose quicker"],
          ].map(([key, lbl, sub]) => (
            <button key={key} onClick={() => setChosen(key)} style={{
              padding: "14px 6px", borderRadius: 14, border: "none", cursor: "pointer", textAlign: "center",
              background: chosen === key ? "#f97316" : "rgba(255,255,255,0.05)",
              outline: chosen === key ? "none" : "1px solid rgba(255,255,255,0.08)",
              transition: "all 0.2s"
            }}>
              <div style={{ fontSize: 10, color: chosen === key ? "rgba(255,255,255,0.8)" : "rgba(255,255,255,0.5)", marginBottom: 4, fontWeight: 700, letterSpacing: "0.04em" }}>{lbl}</div>
              <div style={{ fontSize: 20, fontWeight: 800, color: "#f0f0f0" }}>{plan[key]}</div>
              <div style={{ fontSize: 9, color: chosen === key ? "rgba(255,255,255,0.55)" : "rgba(255,255,255,0.25)", marginTop: 4, lineHeight: 1.4, whiteSpace: "pre-line" }}>{sub}</div>
            </button>
          ))}
        </div>
        {plan.gentle === 1200 && plan.recommended === 1200 && plan.aggressive === 1200 && (
          <div style={{ background: "rgba(249,115,22,0.08)", border: "1px solid rgba(249,115,22,0.2)", borderRadius: 12, padding: "12px 14px", marginBottom: 24, fontSize: 12, color: "rgba(255,255,255,0.55)", lineHeight: 1.6 }}>
            ⚠ Your goal requires a very large deficit — all plans are set to <span style={{ color: "#f97316", fontWeight: 700 }}>1,200 kcal</span>, the safe daily minimum. Consider a longer timeline or a smaller target to get a more personalised plan.
          </div>
        )}

        {/* Stats grid */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
          {[
            { label: "BMR",         val: plan.bmr,         unit: "kcal", note: "Calories at rest" },
            { label: "TDEE",        val: plan.tdee,        unit: "kcal", note: "Total daily burn" },
            { label: "Daily deficit",val: plan.dailyDeficit,unit: "kcal", note: "Below maintenance" },
            { label: "BMI",         val: plan.bmi,         unit: "",     note: bmiLabel, noteColor: bmiColor },
          ].map(s => (
            <div key={s.label} style={{ background: "rgba(255,255,255,0.05)", borderRadius: 14, padding: "16px 14px", border: "1px solid rgba(255,255,255,0.08)" }}>
              <div style={{ fontSize: 10, color: "rgba(255,255,255,0.35)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 8 }}>{s.label}</div>
              <div style={{ fontSize: 24, fontWeight: 800, color: "#fff" }}>{s.val}<span style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", marginLeft: 3 }}>{s.unit}</span></div>
              <div style={{ fontSize: 11, color: s.noteColor || "rgba(255,255,255,0.35)", marginTop: 4 }}>{s.note}</div>
            </div>
          ))}
        </div>

        {/* Macros */}
        <div style={{ background: "rgba(255,255,255,0.05)", borderRadius: 16, padding: "18px 16px", marginBottom: 16, border: "1px solid rgba(255,255,255,0.08)" }}>
          <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 16 }}>Daily macro targets</div>
          {[["Protein", plan.protein, 30, "rgba(255,255,255,0.5)"], ["Carbs", plan.carbs, 40, "rgba(255,255,255,0.5)"], ["Fat", plan.fat, 30, "rgba(255,255,255,0.5)"]].map(([name, g, pct, color]) => (
            <div key={name} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
              <div style={{ width: 8, height: 8, borderRadius: "50%", background: color, flexShrink: 0 }} />
              <div style={{ fontSize: 13, color: "rgba(255,255,255,0.55)", width: 52 }}>{name}</div>
              <div style={{ flex: 1 }}><ProgressBar pct={pct} color={color} h={5} /></div>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#f0f0f0", width: 40, textAlign: "right" }}>{g}g</div>
              <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", width: 30, textAlign: "right" }}>{pct}%</div>
            </div>
          ))}
        </div>

        {/* Timeline */}
        <div style={{ background: "rgba(255,255,255,0.05)", borderRadius: 16, padding: "18px 16px", marginBottom: 24, border: "1px solid rgba(255,255,255,0.08)" }}>
          <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 16 }}>Weight milestone plan</div>
          {milestones.map((m, i) => (
            <div key={i} style={{ display: "flex", gap: 14, alignItems: "flex-start", marginBottom: i < milestones.length - 1 ? 14 : 0 }}>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                <div style={{ width: 28, height: 28, borderRadius: "50%", background: i === 0 ? "rgba(249,115,22,0.25)" : i === milestones.length - 1 ? "rgba(52,211,153,0.25)" : "rgba(255,255,255,0.08)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, color: i === 0 ? "#f97316" : i === milestones.length - 1 ? "#34d399" : "rgba(255,255,255,0.4)" }}>{m.icon}</div>
                {i < milestones.length - 1 && <div style={{ width: 1.5, height: 18, background: "rgba(255,255,255,0.08)", marginTop: 4 }} />}
              </div>
              <div>
                <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", marginBottom: 2 }}>{m.label}</div>
                <div style={{ fontSize: 14, fontWeight: 700 }}>{i === 0 ? "Start journey" : i === milestones.length - 1 ? "Reach goal! 🎉" : `Month ${m.month} checkpoint`}</div>
                <div style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", marginTop: 1 }}>Target: {m.weight} kg</div>
              </div>
            </div>
          ))}
        </div>

        <PrimaryBtn onClick={handleStart} style={{ padding: "17px 20px", fontSize: 16 }}>Start tracking →</PrimaryBtn>
        <div style={{ textAlign: "center", fontSize: 11, color: "rgba(255,255,255,0.2)", marginTop: 10 }}>Based on Mifflin-St Jeor · Adjust anytime in Profile</div>
      </div>
    </div>
  );
}

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 12 }}>
                {[["Protein", scanResult.protein_g, "rgba(255,255,255,0.6)"], ["Carbs", scanResult.carbs_g, "rgba(255,255,255,0.6)"], ["Fat", scanResult.fat_g, "rgba(255,255,255,0.6)"]].map(([n, v, c]) => (
                  <div key={n} style={{ background: "rgba(255,255,255,0.05)", borderRadius: 10, padding: "10px", textAlign: "center" }}>
                    <div style={{ fontSize: 18, fontWeight: 800, color: c }}>{v}g</div>
                    <div style={{ fontSize: 11, color: "rgba(255,255,255,0.55)", marginTop: 2 }}>{n}</div>
                  </div>
                ))}
              </div>
              {scanResult.notes && <div style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", marginBottom: 12, lineHeight: 1.6 }}>{scanResult.notes}</div>}
              <div style={{ display: "flex", gap: 8 }}>
                <select value={meal} onChange={e => setMeal(e.target.value)} style={{ flex: 1, padding: "10px 12px", borderRadius: 10, border: "1px solid rgba(255,255,255,0.08)", background: "rgba(255,255,255,0.05)", color: "#fff", fontSize: 13, fontFamily: "inherit" }}>
                  <option value="breakfast">Breakfast</option>
                  <option value="lunch">Lunch</option>
                  <option value="dinner">Dinner</option>
                  <option value="snack">Snack</option>
                </select>
                <button style={{ background: "linear-gradient(135deg,#f97316,#ea580c)", color: "#fff", border: "none", padding: "10px 18px", borderRadius: 10, fontWeight: 700, fontSize: 13, cursor: "pointer", whiteSpace: "nowrap" }} onClick={addLog}>+ Log it</button>
              </div>
            </div>
          )}

          {/* Weight journey */}
          <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 18, padding: "18px 16px", border: "1px solid rgba(255,255,255,0.08)", marginBottom: 14 }}>

            {/* Row 1: title + meta + log button */}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
              <div>
                <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 4 }}>Weight journey</div>
                <div style={{ fontSize: 12, color: "rgba(255,255,255,0.35)" }}>
                  {deadline.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })} · {daysLeft} days left
                </div>
                {gainedWeight && (
                  <div style={{ fontSize: 12, color: "#f87171", marginTop: 4 }}>
                    ↑ {(profile.weightKg - startW).toFixed(1)} kg — let's get back on track
                  </div>
                )}
              </div>
              <button onClick={() => { setShowWeighIn(v => !v); setWeighInInput(String(profile.weightKg)); }}
                style={{ background: "none", border: "1px solid rgba(255,255,255,0.12)", color: "rgba(255,255,255,0.5)", borderRadius: 8, padding: "5px 11px", fontSize: 11, fontWeight: 600, cursor: "pointer", flexShrink: 0 }}>

              </button>
            </div>

            {/* Row 2: progress bar */}
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "rgba(255,255,255,0.5)", whiteSpace: "nowrap" }}>{startW} kg</div>
              <div style={{ flex: 1, position: "relative" }}>
                <ProgressBar pct={progressPct} color={gainedWeight ? "#f87171" : "#f97316"} h={6} />
                <div style={{ position: "absolute", top: "50%", left: `${dotLeft}%`, transform: "translate(-50%,-50%)", width: 12, height: 12, borderRadius: "50%", background: gainedWeight ? "#f87171" : "#f97316", border: "2px solid #0f0f11" }} />
              </div>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#34d399", whiteSpace: "nowrap" }}>{profile.targetKg} kg</div>
            </div>

            {/* Inline weigh-in input */}
            {showWeighIn && (
              <div style={{ borderTop: "1px solid rgba(255,255,255,0.06)", paddingTop: 14 }}>
                <div style={{ display: "flex", gap: 8 }}>
                  <input type="number" min="20" max="400" step="0.1" placeholder={profile.weightKg} value={weighInInput}
                    onChange={e => setWeighInInput(e.target.value)}
                    style={{ flex: 1, padding: "10px 13px", borderRadius: 10, border: "1px solid rgba(255,255,255,0.12)", background: "rgba(255,255,255,0.05)", color: "#fff", fontSize: 16, fontWeight: 700, fontFamily: "inherit", outline: "none" }} />
                  <button onClick={logWeighIn}
                    style={{ background: "linear-gradient(135deg,#f97316,#ea580c)", color: "#fff", border: "none", padding: "10px 18px", borderRadius: 10, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Save</button>
                </div>
                {weighInInput && parseFloat(weighInInput) > 0 && (
                  <div style={{ fontSize: 11, marginTop: 7 }}>
                    {parseFloat(weighInInput) < profile.weightKg
                      ? <span style={{ color: "#34d399" }}>↓ {(profile.weightKg - parseFloat(weighInInput)).toFixed(1)} kg lost 🎉</span>
                      : parseFloat(weighInInput) > profile.weightKg
                      ? <span style={{ color: "#f87171" }}>↑ {(parseFloat(weighInInput) - profile.weightKg).toFixed(1)} kg gained</span>
                      : <span style={{ color: "rgba(255,255,255,0.35)" }}>No change</span>}
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Activity card — Steps + Exercise */}
          <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 18, padding: "18px 16px", border: "1px solid rgba(255,255,255,0.08)", marginBottom: 14 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div style={{ fontWeight: 700, fontSize: 15 }}>Activity</div>
              <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", background: "rgba(255,255,255,0.05)", padding: "3px 10px", borderRadius: 99 }}>Apple Health soon</div>
            </div>

            {totalBurned > 0 && (
              <div style={{ background: "rgba(52,211,153,0.08)", border: "1px solid rgba(52,211,153,0.2)", borderRadius: 11, padding: "10px 14px", marginBottom: 14, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <div style={{ fontSize: 13, color: "rgba(255,255,255,0.55)" }}>Total burned today</div>
                <div style={{ fontSize: 16, fontWeight: 800, color: "#34d399" }}>+{totalBurned} kcal</div>
              </div>
            )}

            {/* Steps */}
            <div style={{ marginBottom: 14, paddingBottom: 14, borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <Icon name="steps" size={20} color="#34d399"/>
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 700 }}>Steps</div>
                    <div style={{ fontSize: 11, color: "#34d399" }}>+{stepsBurned} kcal earned</div>
                  </div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <div style={{ fontSize: 20, fontWeight: 800, color: "#34d399" }}>{todayActivity.steps.toLocaleString()}</div>
                  <button onClick={() => { setStepsInput(String(todayActivity.steps)); setShowStepsModal(!showStepsModal); setShowExerciseModal(false); }}
                    style={{ background: "rgba(52,211,153,0.15)", border: "1px solid rgba(52,211,153,0.3)", color: "#34d399", borderRadius: 8, padding: "4px 10px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>Edit</button>
                </div>
              </div>
              <ProgressBar pct={Math.round(todayActivity.steps / 10000 * 100)} color="#34d399" h={5} />
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "rgba(255,255,255,0.2)", marginTop: 4 }}>
                <span>0</span><span>10,000 step goal</span>
              </div>
              {showStepsModal && (
                <div style={{ background: "rgba(52,211,153,0.06)", border: "1px solid rgba(52,211,153,0.15)", borderRadius: 11, padding: "12px", marginTop: 10 }}>

                  <div style={{ display: "flex", gap: 7 }}>
                    <input type="number" value={stepsInput} min="0" max="100000" placeholder="e.g. 7500"
                      onChange={e => setStepsInput(e.target.value)}
                      style={{ flex: 1, padding: "9px 12px", borderRadius: 9, border: "1px solid rgba(255,255,255,0.08)", background: "rgba(255,255,255,0.05)", color: "#fff", fontSize: 14, fontFamily: "inherit" }} />
                    <button onClick={() => { saveActivity({ ...todayActivity, steps: Math.max(0, parseInt(stepsInput) || 0) }); setShowStepsModal(false); }}
                      style={{ background: "#34d399", color: "#0f0f11", border: "none", padding: "9px 14px", borderRadius: 9, fontWeight: 800, fontSize: 13, cursor: "pointer" }}>Save</button>
                    <button onClick={() => setShowStepsModal(false)}
                      style={{ background: "rgba(255,255,255,0.08)", color: "rgba(255,255,255,0.55)", border: "none", padding: "9px 10px", borderRadius: 9, cursor: "pointer" }}>✕</button>
                  </div>
                  {stepsInput && <div style={{ fontSize: 11, color: "rgba(52,211,153,0.6)", marginTop: 7 }}>
                    +{stepCalsBurned(parseInt(stepsInput) || 0)} kcal · New goal: {profile.goal + stepCalsBurned(parseInt(stepsInput) || 0) + exBurned} kcal
                  </div>}
                </div>
              )}
            </div>

            {/* Exercise */}
            <div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <Icon name="run" size={20} color="#f97316"/>
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 700 }}>Exercise</div>
                    <div style={{ fontSize: 11, color: "#f97316" }}>+{exBurned} kcal earned</div>
                  </div>
                </div>
                <button onClick={() => { setShowExerciseModal(!showExerciseModal); setShowStepsModal(false); }}
                  style={{ background: "rgba(249,115,22,0.15)", border: "1px solid rgba(249,115,22,0.3)", color: "#f97316", borderRadius: 8, padding: "4px 12px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
                  + Add
                </button>
              </div>

              {showExerciseModal && (
                <div style={{ background: "rgba(249,115,22,0.05)", border: "1px solid rgba(249,115,22,0.15)", borderRadius: 11, padding: "13px", marginBottom: 12 }}>
                  <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", marginBottom: 9 }}>Select exercise</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
                    {EXERCISES.map(ex => (
                      <button key={ex.label} onClick={() => setExType(ex)} style={{
                        padding: "6px 10px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 12,
                        background: exType.label === ex.label ? "rgba(249,115,22,0.25)" : "rgba(255,255,255,0.05)",
                        color: exType.label === ex.label ? "#f97316" : "rgba(255,255,255,0.55)",
                        outline: exType.label === ex.label ? "1.5px solid #f97316" : "none"
                      }}>{ex.icon} {ex.label}</button>
                    ))}
                  </div>
                  <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", marginBottom: 7 }}>Duration (minutes)</div>
                  <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
                    {["15","30","45","60","90"].map(m => (
                      <button key={m} onClick={() => setExMins(m)} style={{
                        flex: 1, padding: "8px 4px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600,
                        background: exMins === m ? "rgba(249,115,22,0.2)" : "rgba(255,255,255,0.05)",
                        color: exMins === m ? "#f97316" : "rgba(255,255,255,0.55)",
                        outline: exMins === m ? "1.5px solid #f97316" : "none"
                      }}>{m}m</button>
                    ))}
                  </div>
                  <div style={{ fontSize: 12, color: "rgba(255,255,255,0.55)", marginBottom: 10 }}>
                    {exType.icon} {exType.label} · {exMins} min = <span style={{ color: "#f97316", fontWeight: 700 }}>+{exerciseCalsBurned(exType.met, parseInt(exMins) || 0, profile.weightKg)} kcal</span>
                  </div>
                  <div style={{ display: "flex", gap: 7 }}>
                    <button onClick={() => {
                      const burned = exerciseCalsBurned(exType.met, parseInt(exMins) || 0, profile.weightKg);
                      const newEx = { id: Date.now(), label: exType.label, icon: exType.icon, mins: parseInt(exMins), burned };
                      saveActivity({ ...todayActivity, exercises: [...(todayActivity.exercises || []), newEx] });
                      setShowExerciseModal(false);
                    }} style={{ flex: 1, background: "#f97316", color: "#fff", border: "none", padding: "10px", borderRadius: 9, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
                      Log exercise
                    </button>
                    <button onClick={() => setShowExerciseModal(false)}
                      style={{ background: "rgba(255,255,255,0.08)", color: "rgba(255,255,255,0.55)", border: "none", padding: "10px 13px", borderRadius: 9, cursor: "pointer" }}>Cancel</button>
                  </div>
                </div>
              )}

              {(todayActivity.exercises || []).length === 0 ? (
                <div style={{ fontSize: 12, color: "rgba(255,255,255,0.2)", textAlign: "center", padding: "8px 0" }}>No exercise logged yet</div>
              ) : (
                (todayActivity.exercises || []).map(ex => (
                  <div key={ex.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
                    <span style={{ fontSize: 18 }}>{ex.icon}</span>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 13, fontWeight: 600 }}>{ex.label}</div>
                      <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)" }}>{ex.mins} min</div>
                    </div>
                    <div style={{ fontSize: 13, fontWeight: 700, color: "#f97316" }}>+{ex.burned} kcal</div>
                    <button onClick={() => saveActivity({ ...todayActivity, exercises: (todayActivity.exercises || []).filter(e => e.id !== ex.id) })}
                      style={{ background: "none", border: "none", color: "rgba(255,255,255,0.2)", cursor: "pointer", fontSize: 15 }}>✕</button>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* Water card — separate, hydration only */}
          <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 18, padding: "18px 16px", border: "1px solid rgba(255,255,255,0.08)", marginBottom: 14 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <Icon name="water" size={20} color="rgba(255,255,255,0.6)"/>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>Water intake</div>
                  <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)" }}>{todayActivity.waterMl} ml of {WATER_GOAL_ML} ml goal</div>
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <button onClick={removeGlass} style={{ width: 28, height: 28, borderRadius: "50%", background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.08)", color: "rgba(255,255,255,0.55)", fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
                <div style={{ fontSize: 18, fontWeight: 800, color: "#fff", minWidth: 28, textAlign: "center" }}>{Math.round(todayActivity.waterMl / GLASS_ML)}</div>
                <button onClick={addGlass} style={{ width: 28, height: 28, borderRadius: "50%", background: "rgba(96,165,250,0.15)", border: "1px solid rgba(96,165,250,0.3)", color: "rgba(255,255,255,0.7)", fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
              </div>
            </div>
            <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 8 }}>
              {Array.from({ length: Math.round(WATER_GOAL_ML / GLASS_ML) }).map((_, i) => {
                const filled = i < Math.round(todayActivity.waterMl / GLASS_ML);
                return (
                  <button key={i} onClick={() => saveActivity({ ...todayActivity, waterMl: (i + 1) * GLASS_ML })}
                    style={{ width: 30, height: 34, borderRadius: 6, border: "1.5px solid " + (filled ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.08)"), background: filled ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.05)", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13 }}>
                    {filled ? <Icon name="water" size={12} color="rgba(255,255,255,0.7)"/> : <span style={{color:"rgba(255,255,255,0.15)",fontSize:10}}>○</span>}
                  </button>
                );
              })}
            </div>
            <ProgressBar pct={Math.round(todayActivity.waterMl / WATER_GOAL_ML * 100)} color="rgba(255,255,255,0.35)" h={4} />
          </div>

          {/* Food log */}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
            <div style={{ fontWeight: 700, fontSize: 15 }}>Today's log</div>
            {todayLog.length > 0 && <button style={{ background: "none", border: "none", color: "#f87171", fontSize: 12, cursor: "pointer" }} onClick={() => setLog({ ...log, [today]: [] })}>Clear all</button>}
          </div>
          {todayLog.length === 0 ? (
            <div style={{ textAlign: "center", padding: "24px", color: "rgba(255,255,255,0.2)", fontSize: 13, background: "rgba(255,255,255,0.05)", border: "1.5px dashed rgba(255,255,255,0.08)", borderRadius: 14 }}>
              Nothing logged yet — scan your first meal!
            </div>
          ) : (
            [...todayLog].reverse().map(e => (
              <div key={e.id} style={{ background: "rgba(255,255,255,0.04)", borderRadius: 18, border: "1px solid rgba(255,255,255,0.08)", marginBottom: 14, padding: 0, overflow: "hidden" }}>
                {/* Normal row */}
                <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 16px" }}>
                  <div style={{ width: 8, height: 8, borderRadius: "50%", background: MEAL_COLORS[e.meal] || "rgba(255,255,255,0.3)", flexShrink: 0 }} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 600, fontSize: 13 }}>{e.name}</div>
                    <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", marginTop: 2 }}>
                      <span style={{ background: "rgba(255,255,255,0.08)", padding: "1px 7px", borderRadius: 6, marginRight: 6, textTransform: "capitalize" }}>{e.meal}</span>
                      P:{e.protein}g · C:{e.carbs}g · F:{e.fat}g
                    </div>
                  </div>
                  <div style={{ fontWeight: 800, fontSize: 14, color: "#f97316" }}>{e.calories}</div>
                  {/* Edit button */}
                  <button
                    onClick={() => setEditEntry(editEntry?.id === e.id ? null : { ...e })}
                    style={{ background: editEntry?.id === e.id ? "rgba(249,115,22,0.2)" : "rgba(255,255,255,0.05)", border: "1px solid " + (editEntry?.id === e.id ? "rgba(249,115,22,0.4)" : "rgba(255,255,255,0.08)"), color: editEntry?.id === e.id ? "#f97316" : "rgba(255,255,255,0.55)", borderRadius: 8, padding: "4px 9px", fontSize: 12, cursor: "pointer", fontWeight: 600 }}
                  >✏</button>
                  <button style={{ background: "none", border: "none", color: "rgba(255,255,255,0.2)", cursor: "pointer", fontSize: 16, padding: "0 2px" }} onClick={() => removeEntry(e.id)}>✕</button>
                </div>
                {/* Inline edit panel */}
                {editEntry?.id === e.id && (
                  <div style={{ borderTop: "1px solid rgba(255,255,255,0.05)", padding: "14px 16px", background: "rgba(249,115,22,0.04)" }}>
                    <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 10 }}>Edit entry</div>
                    {/* Name */}
                    <div style={{ marginBottom: 10 }}>
                      <div style={{ fontSize: 11, color: "rgba(255,255,255,0.55)", marginBottom: 5 }}>Food name</div>
                      <input value={editEntry.name} onChange={ev => setEditEntry(p => ({ ...p, name: ev.target.value }))}
                        style={{ width: "100%", padding: "9px 12px", borderRadius: 9, border: "1px solid rgba(255,255,255,0.08)", background: "rgba(255,255,255,0.05)", color: "#fff", fontSize: 13, fontFamily: "inherit", boxSizing: "border-box" }} />
                    </div>
                    {/* Meal type */}
                    <div style={{ marginBottom: 10 }}>
                      <div style={{ fontSize: 11, color: "rgba(255,255,255,0.55)", marginBottom: 7 }}>Meal</div>
                      <div style={{ display: "flex", gap: 6 }}>
                        {["breakfast","lunch","dinner","snack"].map(m => (
                          <button key={m} onClick={() => setEditEntry(p => ({ ...p, meal: m }))} style={{
                            flex: 1, padding: "8px 4px", borderRadius: 9, border: "none", cursor: "pointer", fontSize: 11, fontWeight: 700, textTransform: "capitalize",
                            background: editEntry.meal === m ? MEAL_COLORS[m] : "rgba(255,255,255,0.08)",
                            color: editEntry.meal === m ? "#fff" : "rgba(255,255,255,0.55)",
                            outline: editEntry.meal === m ? "2px solid " + MEAL_COLORS[m] : "none",
                          }}>{m}</button>
                        ))}
                      </div>
                    </div>
                    {/* Calories */}
                    <div style={{ marginBottom: 12 }}>
                      <div style={{ fontSize: 11, color: "rgba(255,255,255,0.55)", marginBottom: 5 }}>Calories (kcal)</div>
                      <input type="number" value={editEntry.calories} onChange={ev => setEditEntry(p => ({ ...p, calories: parseInt(ev.target.value) || 0 }))}
                        style={{ width: "100%", padding: "9px 12px", borderRadius: 9, border: "1px solid rgba(255,255,255,0.08)", background: "rgba(255,255,255,0.05)", color: "#fff", fontSize: 13, fontFamily: "inherit", boxSizing: "border-box" }} />
                    </div>
                    {/* Save / Cancel */}
                    <div style={{ display: "flex", gap: 8 }}>
                      <button onClick={() => updateEntry(e.id, editEntry)} style={{ flex: 1, background: "linear-gradient(135deg,#f97316,#ea580c)", color: "#fff", border: "none", padding: "10px", borderRadius: 10, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Save changes</button>
                      <button onClick={() => setEditEntry(null)} style={{ background: "rgba(255,255,255,0.08)", color: "rgba(255,255,255,0.55)", border: "none", padding: "10px 14px", borderRadius: 10, fontSize: 13, cursor: "pointer" }}>Cancel</button>
                    </div>

                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    {isPast && (
                      <button onClick={() => openPastDay(selKey)} style={{ background: pastDayKey === selKey ? "rgba(249,115,22,0.2)" : "rgba(255,255,255,0.07)", border: "1px solid " + (pastDayKey === selKey ? "rgba(249,115,22,0.5)" : "rgba(255,255,255,0.1)"), color: pastDayKey === selKey ? "#f97316" : "rgba(255,255,255,0.6)", borderRadius: 9, padding: "6px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                        {pastDayKey === selKey ? "Close" : "✏ Edit day"}
                      </button>
                    )}
                    {!isPast && (
                      <div style={{ fontSize: 11, color: "rgba(255,255,255,0.3)", background: "rgba(255,255,255,0.05)", borderRadius: 8, padding: "5px 10px" }}>Log in Today tab</div>
                    )}
                    {selKey !== today && <button onClick={() => { setSelectedDay(null); setPastDayKey(null); }} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.3)", fontSize: 11, cursor: "pointer" }}>Back</button>}
                  </div>
                </div>

                {/* Macros summary */}
                <div style={{ padding: "14px 16px" }}>
                  {selCal === 0 ? (
                    <div style={{ fontSize: 13, color: "rgba(255,255,255,0.35)", textAlign: "center", padding: "10px 0" }}>No food logged {selKey === today ? "today" : "this day"}</div>
                  ) : (
                    <>
                      <div style={{ fontSize: 13, color: "rgba(255,255,255,0.55)", marginBottom: 12 }}>Total: <span style={{ color: "#fff", fontWeight: 700 }}>{selCal} kcal</span></div>
                      {[["Protein", selP, profile.protein, true], ["Carbs", selC, profile.carbs, false], ["Fat", selF, profile.fat, false]].map(([name, val, target, isProtein]) => {
                        const over  = val > target;
                        const met   = val >= target;
                        const under = isProtein && !met && val > 0;
                        const color = over ? "#f87171" : met && isProtein ? "#34d399" : under ? "#f97316" : "rgba(255,255,255,0.5)";
                        return (
                          <div key={name} style={{ marginBottom: 12 }}>
                            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 5 }}>
                              <span style={{ color }}>{name}</span>
                              <span style={{ fontWeight: 700, color: over || under || (met && isProtein) ? color : "#fff" }}>
                                {val}g
                                {over ? <span style={{ fontSize: 11, marginLeft: 5 }}>+{val - target}g over</span>
                                      : met && isProtein ? <span style={{ fontSize: 11, marginLeft: 5 }}>✓</span>
                                      : <span style={{ color: "rgba(255,255,255,0.35)", fontWeight: 400 }}> / {target}g</span>}
                              </span>
                            </div>
                            <ProgressBar pct={Math.min(100, Math.round(val / target * 100))} color={color} h={5} />
                          </div>
                        );
                      })}
                      <div style={{ borderTop: "1px solid rgba(255,255,255,0.05)", paddingTop: 10, marginTop: 4 }}>
                        {selEntries.map(e => (
                          <div key={e.id} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 7 }}>
                            <div style={{ width: 7, height: 7, borderRadius: "50%", background: MEAL_COLORS[e.meal] || "rgba(255,255,255,0.3)", flexShrink: 0 }} />
                            <div style={{ flex: 1, fontSize: 12 }}>{e.name}</div>
                            <div style={{ fontSize: 12, color: "#f97316", fontWeight: 700 }}>{e.calories}</div>
                            {isPast && <button onClick={() => removePastEntry(selKey, e.id)} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.2)", cursor: "pointer", fontSize: 14 }}>✕</button>}
                          </div>
                        ))}
                      </div>
                    </>
                  )}
                </div>

                {/* ── PAST DAY EDITOR (only for past days when open) ── */}
                {isPast && pastDayKey === selKey && (
                  <div style={{ borderTop: "1px solid rgba(249,115,22,0.2)", background: "rgba(249,115,22,0.03)", padding: "16px" }}>
                    <div style={{ fontSize: 11, color: "#f97316", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 14 }}>Log past data — {selLabel}</div>

                    {/* ── Add food via AI scan ── */}
                    <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 14, padding: "14px", marginBottom: 12, border: "1px solid rgba(255,255,255,0.07)" }}>
                      <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 10, display:"flex", alignItems:"center", gap:6 }}><Icon name="camera" size={14} color="#f97316"/> Scan food for {selLabel}</div>
                      <input type="file" ref={pastFileRef} accept="image/*" style={{ display: "none" }} onChange={handlePastFile} />

                      {!pastScanPreview ? (
                        <div style={{ textAlign: "center", padding: "10px 0" }}>
                          <div style={{ marginBottom: 8 }}><Icon name="camera" size={32} color="rgba(255,255,255,0.35)"/></div>
                          <div style={{ fontSize: 13, color: "rgba(255,255,255,0.4)", marginBottom: 12 }}>AI identifies calories & macros instantly</div>
                          <button onClick={() => pastFileRef.current.click()} style={{ background: "linear-gradient(135deg,#f97316,#ea580c)", color: "#fff", border: "none", padding: "10px 22px", borderRadius: 99, fontSize: 13, fontWeight: 700, cursor: "pointer", boxShadow: "0 4px 14px rgba(249,115,22,0.35)" }}>
                            Choose photo
                          </button>
                        </div>
                      ) : (
                        <div>
                          <div style={{ position: "relative", marginBottom: 10 }}>
                            <img src={pastScanPreview} alt="" style={{ width: "100%", borderRadius: 10, maxHeight: 160, objectFit: "cover", display: "block" }} />
                            <button onClick={() => { setPastScanPreview(null); setPastScanB64(null); setPastScanResult(null); setPastScanError(""); if (pastFileRef.current) pastFileRef.current.value = ""; }}
                              style={{ position: "absolute", top: 6, right: 6, width: 26, height: 26, borderRadius: "50%", background: "rgba(0,0,0,0.65)", border: "none", color: "#fff", fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700 }}>✕</button>
                          </div>
                          {pastScanLoading ? (
                            <div style={{ textAlign: "center", fontSize: 13, color: "rgba(255,255,255,0.5)", padding: "8px 0" }}>Analysing…</div>
                          ) : !pastScanResult ? (
                            <button onClick={analysePast} style={{ width: "100%", background: "linear-gradient(135deg,#f97316,#ea580c)", color: "#fff", border: "none", padding: "11px", borderRadius: 10, fontSize: 13, fontWeight: 700, cursor: "pointer" }}><Icon name="scan" size={14} color="#fff"/> Analyse</button>
                          ) : null}
                        </div>
                      )}

                      {pastScanError && <div style={{ background: "rgba(248,113,113,0.1)", border: "1px solid rgba(248,113,113,0.2)", color: "#f87171", padding: "8px 12px", borderRadius: 9, fontSize: 12, marginTop: 8 }}>⚠ {pastScanError}</div>}

                      {pastScanResult && (
                        <div style={{ marginTop: 10 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                            <Icon name="food" size={18} color="#f97316"/>
                            <div style={{ flex: 1, fontWeight: 700, fontSize: 14 }}>{pastScanResult.name}</div>
                            <div style={{ background: "#f97316", color: "#fff", padding: "3px 10px", borderRadius: 99, fontSize: 12, fontWeight: 700 }}>{pastScanResult.calories} kcal</div>
                          </div>
                          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6, marginBottom: 10 }}>
                            {[["Protein", pastScanResult.protein_g, "rgba(255,255,255,0.6)"], ["Carbs", pastScanResult.carbs_g, "rgba(255,255,255,0.6)"], ["Fat", pastScanResult.fat_g, "rgba(255,255,255,0.6)"]].map(([n, v, c]) => (
                              <div key={n} style={{ background: "rgba(255,255,255,0.05)", borderRadius: 8, padding: "8px", textAlign: "center" }}>
                                <div style={{ fontSize: 15, fontWeight: 800, color: c }}>{v}g</div>
                                <div style={{ fontSize: 10, color: "rgba(255,255,255,0.45)", marginTop: 2 }}>{n}</div>
                              </div>
                            ))}
                          </div>
                          <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
                            {["breakfast","lunch","dinner","snack"].map(m => (
                              <button key={m} onClick={() => setPastMeal(m)} style={{ flex: 1, padding: "7px 4px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 11, fontWeight: 700, textTransform: "capitalize", background: pastMeal === m ? MEAL_COLORS[m] : "rgba(255,255,255,0.07)", color: pastMeal === m ? "#fff" : "rgba(255,255,255,0.45)" }}>{m}</button>
                            ))}
                          </div>
                          <div style={{ display: "flex", gap: 7 }}>
                            <button onClick={() => {
                              const entry = { id: Date.now(), name: pastScanResult.name, calories: pastScanResult.calories, protein: pastScanResult.protein_g, carbs: pastScanResult.carbs_g, fat: pastScanResult.fat_g, meal: pastMeal };
                              setLog({ ...log, [selKey]: [...(log[selKey] || []), entry] });
                              setPastScanPreview(null); setPastScanB64(null); setPastScanResult(null); setPastScanError(""); if (pastFileRef.current) pastFileRef.current.value = "";
                            }} style={{ flex: 1, background: "linear-gradient(135deg,#f97316,#ea580c)", color: "#fff", border: "none", padding: "10px", borderRadius: 10, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>+ Log to {selLabel}</button>
                            <button onClick={() => { setPastScanPreview(null); setPastScanB64(null); setPastScanResult(null); if (pastFileRef.current) pastFileRef.current.value = ""; }} style={{ background: "rgba(255,255,255,0.08)", color: "rgba(255,255,255,0.5)", border: "none", padding: "10px 12px", borderRadius: 10, cursor: "pointer", fontSize: 12 }}>Retry</button>
                          </div>
                        </div>
                      )}
                    </div>

                    {/* ── Steps ── */}
                    <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 14, padding: "14px", marginBottom: 12, border: "1px solid rgba(255,255,255,0.07)" }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                        <div style={{ fontWeight: 700, fontSize: 13, display:"flex", alignItems:"center", gap:6 }}><Icon name="steps" size={13} color="#34d399"/>Steps</div>
                        <div style={{ fontSize: 13, color: "#34d399", fontWeight: 700 }}>{(pastAct.steps || 0).toLocaleString()} steps</div>
                      </div>
                      <div style={{ display: "flex", gap: 7 }}>
                        <input type="number" min="0" max="100000" placeholder="e.g. 8000" value={pastStepsInput} onChange={e => setPastStepsInput(e.target.value)}
                          style={{ flex: 1, padding: "9px 12px", borderRadius: 9, border: "1px solid rgba(255,255,255,0.08)", background: "rgba(255,255,255,0.05)", color: "#fff", fontSize: 13, fontFamily: "inherit" }} />
                        <button onClick={() => { saveActivityForDay(selKey, { ...pastAct, steps: Math.max(0, parseInt(pastStepsInput)||0) }); }}
                          style={{ background: "#34d399", color: "#0f0f11", border: "none", padding: "9px 14px", borderRadius: 9, fontWeight: 800, fontSize: 13, cursor: "pointer" }}>Save</button>
                      </div>
                      {pastStepsInput && <div style={{ fontSize: 11, color: "rgba(52,211,153,0.6)", marginTop: 6 }}>+{stepCalsBurned(parseInt(pastStepsInput)||0)} kcal burned</div>}
                    </div>

                    {/* ── Exercise ── */}
                    <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 14, padding: "14px", marginBottom: 12, border: "1px solid rgba(255,255,255,0.07)" }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: (pastAct.exercises||[]).length > 0 ? 10 : (pastShowExercise ? 12 : 0) }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <Icon name="run" size={18} color="#f97316"/>
                          <div>
                            <div style={{ fontWeight: 700, fontSize: 13 }}>Exercise</div>
                            <div style={{ fontSize: 11, color: "#f97316" }}>+{(pastAct.exercises||[]).reduce((s,e)=>s+e.burned,0)} kcal earned</div>
                          </div>
                        </div>
                        <button onClick={() => setPastShowExercise(v => !v)} style={{ background: "rgba(249,115,22,0.15)", border: "1px solid rgba(249,115,22,0.3)", color: "#f97316", borderRadius: 8, padding: "4px 12px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
                          {pastShowExercise ? "Close" : "+ Add"}
                        </button>
                      </div>

                      {pastShowExercise && (
                        <div style={{ background: "rgba(249,115,22,0.05)", border: "1px solid rgba(249,115,22,0.15)", borderRadius: 11, padding: "13px", marginBottom: (pastAct.exercises||[]).length > 0 ? 10 : 0 }}>
                          <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", marginBottom: 9 }}>Select exercise</div>
                          <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: 10 }}>
                            {EXERCISES.map(ex => (
                              <button key={ex.label} onClick={() => setPastExType(ex)} style={{ padding: "5px 9px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 11, background: pastExType.label === ex.label ? "rgba(249,115,22,0.25)" : "rgba(255,255,255,0.05)", color: pastExType.label === ex.label ? "#f97316" : "rgba(255,255,255,0.5)", outline: pastExType.label === ex.label ? "1.5px solid #f97316" : "none" }}>{ex.icon} {ex.label}</button>
                            ))}
                          </div>
                          <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", marginBottom: 7 }}>Duration (minutes)</div>
                          <div style={{ display: "flex", gap: 5, marginBottom: 10 }}>
                            {["15","30","45","60","90"].map(m => (
                              <button key={m} onClick={() => setPastExMins(m)} style={{ flex: 1, padding: "7px 3px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 11, fontWeight: 600, background: pastExMins === m ? "rgba(249,115,22,0.2)" : "rgba(255,255,255,0.05)", color: pastExMins === m ? "#f97316" : "rgba(255,255,255,0.5)", outline: pastExMins === m ? "1.5px solid #f97316" : "none" }}>{m}m</button>
                            ))}
                          </div>
                          <div style={{ fontSize: 12, color: "rgba(255,255,255,0.45)", marginBottom: 10 }}>{pastExType.icon} {pastExType.label} · {pastExMins} min = <span style={{ color: "#f97316", fontWeight: 700 }}>+{exerciseCalsBurned(pastExType.met, parseInt(pastExMins)||0, profile.weightKg)} kcal</span></div>
                          <div style={{ display: "flex", gap: 7 }}>
                            <button onClick={() => {
                              const burned = exerciseCalsBurned(pastExType.met, parseInt(pastExMins)||0, profile.weightKg);
                              const newEx = { id: Date.now(), label: pastExType.label, icon: pastExType.icon, mins: parseInt(pastExMins), burned };
                              saveActivityForDay(selKey, { ...pastAct, exercises: [...(pastAct.exercises||[]), newEx] });
                              setPastShowExercise(false);
                            }} style={{ flex: 1, background: "#f97316", color: "#fff", border: "none", padding: "10px", borderRadius: 9, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Log exercise</button>
                            <button onClick={() => setPastShowExercise(false)} style={{ background: "rgba(255,255,255,0.08)", color: "rgba(255,255,255,0.5)", border: "none", padding: "10px 13px", borderRadius: 9, cursor: "pointer" }}>Cancel</button>
                          </div>
                        </div>
                      )}

                      {(pastAct.exercises||[]).length === 0 && !pastShowExercise ? (
                        <div style={{ fontSize: 12, color: "rgba(255,255,255,0.2)", textAlign: "center", paddingTop: 8 }}>No exercise logged yet</div>
                      ) : (
                        (pastAct.exercises||[]).map(ex => (
                          <div key={ex.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 0", borderBottom: "1px solid rgba(255,255,255,0.04)" }}>
                            <span style={{ fontSize: 15 }}>{ex.icon}</span>
                            <div style={{ flex: 1, fontSize: 12 }}>{ex.label} · {ex.mins}m</div>
                            <div style={{ fontSize: 12, color: "#f97316", fontWeight: 700 }}>+{ex.burned} kcal</div>
                            <button onClick={() => saveActivityForDay(selKey, { ...pastAct, exercises: (pastAct.exercises||[]).filter(e => e.id !== ex.id) })} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.2)", cursor: "pointer", fontSize: 13 }}>✕</button>
                          </div>
                        ))
                      )}
                    </div>

                    {/* ── Water ── */}
                    <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 14, padding: "14px", border: "1px solid rgba(255,255,255,0.07)" }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <Icon name="water" size={20} color="rgba(255,255,255,0.6)"/>
                          <div>
                            <div style={{ fontWeight: 700, fontSize: 14 }}>Water intake</div>
                            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)" }}>{pastAct.waterMl||0} ml of {WATER_GOAL_ML} ml goal</div>
                          </div>
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          <button onClick={() => saveActivityForDay(selKey, { ...pastAct, waterMl: Math.max(0, (pastAct.waterMl||0) - GLASS_ML) })} style={{ width: 28, height: 28, borderRadius: "50%", background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.08)", color: "rgba(255,255,255,0.55)", fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
                          <div style={{ fontSize: 18, fontWeight: 800, color: "#fff", minWidth: 28, textAlign: "center" }}>{Math.round((pastAct.waterMl||0)/GLASS_ML)}</div>
                          <button onClick={() => saveActivityForDay(selKey, { ...pastAct, waterMl: Math.min(WATER_GOAL_ML*2, (pastAct.waterMl||0) + GLASS_ML) })} style={{ width: 28, height: 28, borderRadius: "50%", background: "rgba(96,165,250,0.15)", border: "1px solid rgba(96,165,250,0.3)", color: "rgba(255,255,255,0.7)", fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 8 }}>
                        {Array.from({ length: Math.round(WATER_GOAL_ML / GLASS_ML) }).map((_, i) => {
                          const filled = i < Math.round((pastAct.waterMl||0) / GLASS_ML);
                          return (
                            <button key={i} onClick={() => saveActivityForDay(selKey, { ...pastAct, waterMl: (i + 1) * GLASS_ML })}
                              style={{ width: 30, height: 34, borderRadius: 6, border: "1.5px solid " + (filled ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.08)"), background: filled ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.05)", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13 }}>
                              {filled ? <Icon name="water" size={12} color="rgba(255,255,255,0.7)"/> : <span style={{color:"rgba(255,255,255,0.15)",fontSize:10}}>○</span>}
                            </button>
                          );
                        })}
                      </div>
                      <ProgressBar pct={Math.round((pastAct.waterMl||0) / WATER_GOAL_ML * 100)} color="rgba(255,255,255,0.35)" h={4} />
                    </div>
                  </div>
                )}
              </div>
            );
          })()}
        </div>
      )}

      {/* ─── PROFILE ─── */}
      {tab === "profile" && (
        <div style={{ maxWidth: 460, margin: "0 auto", padding: "18px 20px 80px" }}>

          {/* ── EDIT PROFILE PANEL ── */}
          {showEditProfile && editProf && (
            <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 18, padding: "18px 16px", marginBottom: 14, border: "1.5px solid rgba(249,115,22,0.3)" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
                <div style={{ fontWeight: 800, fontSize: 16 }}>Edit Profile</div>
                <button onClick={() => { setShowEditProfile(false); setShowAvatarPicker(false); }} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.55)", fontSize: 20, cursor: "pointer" }}>✕</button>
              </div>

              {/* Avatar picker */}
              <div style={{ textAlign: "center", marginBottom: 16 }}>
                <div style={{ position: "relative", display: "inline-block" }}>
                  <div style={{ width: 72, height: 72, borderRadius: "50%", background: editProf.avatarImg ? "transparent" : (editProf.avatarColor || "#f97316"), display: "flex", alignItems: "center", justifyContent: "center", fontSize: 34, margin: "0 auto", cursor: "pointer", border: "3px solid rgba(249,115,22,0.5)", overflow: "hidden" }} onClick={() => setShowAvatarPicker(!showAvatarPicker)}>
                    {editProf.avatarImg
                      ? <img src={editProf.avatarImg} alt="avatar" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                      : (editProf.avatar || "👤")
                    }
                  </div>
                  <div style={{ position: "absolute", bottom: 0, right: 0, width: 22, height: 22, borderRadius: "50%", background: "#f97316", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, cursor: "pointer" }} onClick={() => setShowAvatarPicker(!showAvatarPicker)}>✏</div>
                </div>
                <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", marginTop: 6 }}>Tap to change avatar</div>
              </div>

              {/* Avatar emoji grid */}
              {showAvatarPicker && (
                <div style={{ background: "rgba(255,255,255,0.05)", borderRadius: 14, padding: 14, marginBottom: 14 }}>

                  {/* Upload photo option — always at the top */}
                  <div style={{ fontSize: 11, color: "rgba(255,255,255,0.55)", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.08em" }}>Upload photo</div>
                  <input
                    type="file"
                    ref={avatarFileRef}
                    accept="image/*"
                    style={{ display: "none" }}
                    onChange={e => {
                      const file = e.target.files[0];
                      if (!file) return;
                      // Resize & compress to base64 using a canvas
                      const reader = new FileReader();
                      reader.onload = ev => {
                        const img = new Image();
                        img.onload = () => {
                          const canvas = document.createElement("canvas");
                          const size = 200;
                          canvas.width = size; canvas.height = size;
                          const ctx = canvas.getContext("2d");
                          // crop square from centre
                          const min = Math.min(img.width, img.height);
                          const sx = (img.width - min) / 2;
                          const sy = (img.height - min) / 2;
                          ctx.beginPath();
                          ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
                          ctx.clip();
                          ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
                          const base64 = canvas.toDataURL("image/jpeg", 0.75);
                          setEditProf(p => ({ ...p, avatarImg: base64, avatar: null }));
                          setShowAvatarPicker(false);
                        };
                        img.src = ev.target.result;
                      };
                      reader.readAsDataURL(file);
                    }}
                  />
                  <button
                    onClick={() => avatarFileRef.current.click()}
